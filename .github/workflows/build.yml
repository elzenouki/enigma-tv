name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name ci && git config user.email ci@local
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          tail -c 60000 build.log > failed-build.log
          git add -f failed-build.log
          git commit -m "build log ${GITHUB_RUN_NUMBER}"
          git push -f origin ci-logs

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk enigma-tv.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Enigma TV v1.0.${{ github.run_number }}
          make_latest: "true"
          files: enigma-tv.apk
